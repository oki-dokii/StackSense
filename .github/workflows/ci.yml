name: Verify StackSense
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.17.1, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix benchmarks/postgres
      - run: node --test benchmarks/postgres/tests.mjs
      - run: npm run check
      - run: node --test scripts/tests/evidence-bindings.test.mjs scripts/tests/calibration.test.mjs scripts/tests/evidence-review.test.mjs
      - run: npm run build
      - run: npm run evaluate
      - run: npm run verify:release

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: stacksense-ci-only
          POSTGRES_USER: stacksense
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.17.1
      - run: npm ci --prefix benchmarks/postgres
      - run: node --test benchmarks/postgres/tests.mjs
        env:
          STACKSENSE_TEST_DATABASE: '1'
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: stacksense
          PGPASSWORD: stacksense-ci-only
          PGDATABASE: postgres
